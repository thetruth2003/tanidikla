[PHP]
extension_dir="${PHP_EXTENSION_DIR}"
extension=curl
extension=fileinfo
extension=gd
extension=mbstring
extension=openssl
extension=pdo_pgsql
extension=pgsql
extension=zip
date.timezone=UTC
display_errors=On
log_errors=On
error_log="storage/logs/php-error.log"
upload_max_filesize=8M
post_max_size=10M
max_execution_time=60
memory_limit=256M
session.use_strict_mode=1
expose_php=Off
